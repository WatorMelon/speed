<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>码表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  #app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #speed {
    font-size: min(52dvh, 30vw);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: #fff;
    transition: color .3s;
  }

  #speed.stale { color: #444; }

  #unit {
    font-size: min(5dvh, 5vw);
    color: #666;
    letter-spacing: .3em;
    margin-left: .3em;
  }

  #status {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 10px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #555;
  }

  #dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f33;
  }
  #dot.ok   { background: #0c6; }
  #dot.wait { background: #fa0; }

  #max {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 12px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: #555;
    font-variant-numeric: tabular-nums;
  }

  /* 横屏：速度偏左，留出握持区 */
  @media (orientation: landscape) {
    #app { flex-direction: row; justify-content: center; gap: 3vw; }
    #speed { font-size: min(60dvh, 24vw); }
  }
</style>
</head>
<body>
<div id="app">
  <div>
    <span id="speed">--</span>
    <span id="unit">km/h</span>
  </div>
</div>
<div id="status"><span id="dot" class="wait"></span><span id="statusText">GPS 定位中…</span></div>
<div id="max">最高 0.0</div>

<script>
(function () {
  var speedEl = document.getElementById('speed');
  var dotEl = document.getElementById('dot');
  var statusTextEl = document.getElementById('statusText');
  var maxEl = document.getElementById('max');

  var maxSpeed = 0;
  var lastFix = null;       // 上一次有效定位
  var staleTimer = null;    // 超过 5 秒没更新则置灰

  function setStatus(cls, text) {
    dotEl.className = cls;
    statusTextEl.textContent = text;
  }

  function refreshStale() {
    clearTimeout(staleTimer);
    speedEl.classList.remove('stale');
    staleTimer = setTimeout(function () {
      speedEl.classList.add('stale');
      setStatus('wait', '信号丢失');
    }, 5000);
  }

  // coords.speed 不可用时，用两次定位的距离/时间差估算
  function calcFallbackSpeed(fix) {
    if (!lastFix) return null;
    var dt = (fix.time - lastFix.time) / 1000;
    if (dt <= 0 || dt > 10) return null;
    var R = 6371000;
    var rad = Math.PI / 180;
    var dLat = (fix.lat - lastFix.lat) * rad;
    var dLon = (fix.lon - lastFix.lon) * rad;
    var a = Math.sin(dLat/2)**2 +
            Math.cos(lastFix.lat*rad) * Math.cos(fix.lat*rad) * Math.sin(dLon/2)**2;
    var dist = 2 * R * Math.asin(Math.sqrt(a));
    return dist / dt; // m/s
  }

  function onPos(pos) {
    var c = pos.coords;
    var now = Date.now();
    var fix = { lat: c.latitude, lon: c.longitude, time: now };

    var ms = c.speed; // m/s，可能为 null
    if (ms == null || !isFinite(ms)) ms = calcFallbackSpeed(fix);

    lastFix = fix;

    if (ms == null || !isFinite(ms)) {
      setStatus('wait', '等待速度数据…');
      return;
    }

    // 低速时 GPS 抖动大，直接归零
    var kmh = ms < 0.5 ? 0 : ms * 3.6;

    speedEl.textContent = kmh >= 100 ? Math.round(kmh) : kmh.toFixed(1);
    if (kmh > maxSpeed) {
      maxSpeed = kmh;
      maxEl.textContent = '最高 ' + maxSpeed.toFixed(1);
    }

    setStatus('ok', 'GPS 已连接');
    refreshStale();
  }

  var ERR_TEXT = {
    1: '定位权限被拒绝，请在浏览器设置中允许',
    2: '位置不可用：请打开系统定位开关并到空旷处',
    3: '定位超时，正在重试…（首次定位可能需要 1 分钟）'
  };

  function onErr(err) {
    setStatus('wait', ERR_TEXT[err.code] || ('定位失败：' + err.message));
  }

  if (!navigator.geolocation) {
    setStatus('', '设备不支持定位');
    return;
  }

  if (!window.isSecureContext) {
    setStatus('', '页面非 HTTPS，浏览器已禁用定位');
  }

  navigator.geolocation.watchPosition(onPos, onErr, {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 30000
  });
})();
</script>
<script>
// PWA 离线缓存：首次打开后可离线使用，刷新也不会丢
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
</body>
</html>
