<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>码表</title>
<script>
// 首屏前应用主题与屏幕方向，避免闪烁：auto=跟随系统（默认）/ dark / light
(function () {
  try {
    var t = localStorage.getItem('theme') || 'auto';
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    var o = localStorage.getItem('orient') || 'auto';
    if (o === 'portrait' || o === 'landscape') document.documentElement.setAttribute('data-orient', o);
  } catch (e) {}
})();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* 主题变量：默认浅色，系统深色时自动切换，显式 data-theme 覆盖 */
  :root {
    --bg: #f5f5f7;
    --fg: #111111;
    --fg-dim: #8a8a8e;
    --fg-dim2: #9a9aa0;
    --fg-stale: #c4c4cc;
    --border: #d8d8de;
    --panel: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --fg-dim: #666666;
      --fg-dim2: #555555;
      --fg-stale: #444444;
      --border: #333333;
      --panel: #1c1c1e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --fg: #ffffff;
    --fg-dim: #666666;
    --fg-dim2: #555555;
    --fg-stale: #444444;
    --border: #333333;
    --panel: #1c1c1e;
  }
  :root[data-theme="light"] {
    --bg: #f5f5f7;
    --fg: #111111;
    --fg-dim: #8a8a8e;
    --fg-dim2: #9a9aa0;
    --fg-stale: #c4c4cc;
    --border: #d8d8de;
    --panel: #ffffff;
  }

  html, body {
    height: 100%;
    background: #f5f5f7;
    background: var(--bg);
    color: #111111;
    color: var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    transition: background .3s, color .3s;
  }

  /* 屏幕旋转包装层：默认铺满视口，内部 fixed 元素以此为包含块 */
  #screen {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    inset: 0;
    overflow: hidden;
  }
  /* 物理竖屏 → 强制横屏：顺时针 90°，宽高互换
     显示边映射：上→物理右，右→物理下，下→物理左，左→物理上 */
  @media (orientation: portrait) {
    html[data-orient="landscape"] #screen {
      width: 100vh;
      width: 100dvh;
      height: 100vw;
      -webkit-transform: translate3d(100vw, 0, 0) rotate(90deg);
      transform: translate3d(100vw, 0, 0) rotate(90deg);
      transform-origin: left top;
    }
    html[data-orient="landscape"] #app {
      padding: env(safe-area-inset-right) env(safe-area-inset-bottom)
               env(safe-area-inset-left) env(safe-area-inset-top);
    }
    html[data-orient="landscape"] #status { top: calc(constant(safe-area-inset-right) + 10px); top: calc(env(safe-area-inset-right) + 10px); }
    html[data-orient="landscape"] #max { bottom: calc(constant(safe-area-inset-left) + 12px); bottom: calc(env(safe-area-inset-left) + 12px); }
    html[data-orient="landscape"] #settingsBtn,
    html[data-orient="landscape"] #orientBtn {
      top: calc(constant(safe-area-inset-right) + 8px); top: calc(env(safe-area-inset-right) + 8px);
    }
    html[data-orient="landscape"] #settingsBtn { right: calc(constant(safe-area-inset-bottom) + 10px); right: calc(env(safe-area-inset-bottom) + 10px); }
    html[data-orient="landscape"] #orientBtn { right: calc(constant(safe-area-inset-bottom) + 54px); right: calc(env(safe-area-inset-bottom) + 54px); }
  }
  /* 物理横屏 → 强制竖屏：逆时针 90°，宽高互换
     显示边映射：上→物理左，右→物理上，下→物理右，左→物理下 */
  @media (orientation: landscape) {
    html[data-orient="portrait"] #screen {
      width: 100vh;
      width: 100dvh;
      height: 100vw;
      -webkit-transform: translate3d(0, 100vh, 0) rotate(-90deg);
      -webkit-transform: translate3d(0, 100dvh, 0) rotate(-90deg);
      transform: translate3d(0, 100vh, 0) rotate(-90deg);
      transform: translate3d(0, 100dvh, 0) rotate(-90deg);
      transform-origin: left top;
    }
    html[data-orient="portrait"] #app {
      padding: env(safe-area-inset-left) env(safe-area-inset-top)
               env(safe-area-inset-right) env(safe-area-inset-bottom);
    }
    html[data-orient="portrait"] #status { top: calc(constant(safe-area-inset-left) + 10px); top: calc(env(safe-area-inset-left) + 10px); }
    html[data-orient="portrait"] #max { bottom: calc(constant(safe-area-inset-right) + 12px); bottom: calc(env(safe-area-inset-right) + 12px); }
    html[data-orient="portrait"] #settingsBtn,
    html[data-orient="portrait"] #orientBtn {
      top: calc(constant(safe-area-inset-left) + 8px); top: calc(env(safe-area-inset-left) + 8px);
    }
    html[data-orient="portrait"] #settingsBtn { right: calc(constant(safe-area-inset-top) + 10px); right: calc(env(safe-area-inset-top) + 10px); }
    html[data-orient="portrait"] #orientBtn { right: calc(constant(safe-area-inset-top) + 54px); right: calc(env(safe-area-inset-top) + 54px); }
  }

  #app {
    height: 100%;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    justify-content: center;
    gap: calc(2 * var(--Uvh, 1vh));
    padding: constant(safe-area-inset-top) constant(safe-area-inset-right) constant(safe-area-inset-bottom) constant(safe-area-inset-left);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* 数字严格居中，单位挂在数字右下（不挤占居中宽度） */
  #app > div { position: relative; display: inline-block; }

  /* 竖屏显示：字号按数字位数分档，尽量放大又不溢出（右侧还要留 km/h） */
  #speed {
    font-size: calc(45 * var(--Uvh, 1vh));
    font-size: min(calc(60 * var(--Uvh, 1vh)), calc(32 * var(--Uvw, 1vw)));
  }
  #speed[data-len="2"] {
    font-size: calc(45 * var(--Uvh, 1vh));
    font-size: min(calc(60 * var(--Uvh, 1vh)), calc(58 * var(--Uvw, 1vw)));
  }
  #speed[data-len="3"] {
    font-size: calc(45 * var(--Uvh, 1vh));
    font-size: min(calc(60 * var(--Uvh, 1vh)), calc(46 * var(--Uvw, 1vw)));
  }
  #speed[data-len="4"] {
    font-size: calc(45 * var(--Uvh, 1vh));
    font-size: min(calc(60 * var(--Uvh, 1vh)), calc(34 * var(--Uvw, 1vw)));
  }

  #speed {
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: #111111;
    color: var(--fg);
    transition: color .3s;
  }

  #speed.stale { color: #c4c4cc; color: var(--fg-stale); }

  #unit {
    position: absolute;
    left: 100%;
    bottom: 0.08em;
    margin-left: .25em;
    font-size: calc(4 * var(--Uvh, 1vh));
    font-size: min(calc(5 * var(--Uvh, 1vh)), calc(5 * var(--Uvw, 1vw)));
    color: #8a8a8e;
    color: var(--fg-dim);
    letter-spacing: .2em;
    white-space: nowrap;
  }

  #status {
    position: fixed;
    top: 10px;
    top: calc(constant(safe-area-inset-top) + 10px);
    top: calc(env(safe-area-inset-top) + 10px);
    left: 50%;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #9a9aa0;
    color: var(--fg-dim2);
  }

  #dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f33;
  }
  #dot.ok   { background: #0c6; }
  #dot.wait { background: #fa0; }

  #max {
    position: fixed;
    bottom: 12px;
    bottom: calc(constant(safe-area-inset-bottom) + 12px);
    bottom: calc(env(safe-area-inset-bottom) + 12px);
    left: 50%;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    font-size: 14px;
    color: #9a9aa0;
    color: var(--fg-dim2);
    font-variant-numeric: tabular-nums;
  }

  /* 横屏布局：强制横屏，或 auto 下物理横屏（选择器含两个 id 以覆盖竖屏分档） */
  html[data-orient="landscape"] #app {
    flex-direction: row;
    gap: calc(3 * var(--Uvw, 1vw));
  }
  html[data-orient="landscape"] #screen #speed {
    font-size: calc(24 * var(--Uvw, 1vw));
    font-size: min(calc(60 * var(--Uvh, 1vh)), calc(26 * var(--Uvw, 1vw)));
  }
  @media (orientation: landscape) {
    html:not([data-orient="portrait"]) #app {
      flex-direction: row;
      gap: calc(3 * var(--Uvw, 1vw));
    }
    html:not([data-orient="portrait"]) #screen #speed {
      font-size: calc(24 * var(--Uvw, 1vw));
      font-size: min(calc(60 * var(--Uvh, 1vh)), calc(26 * var(--Uvw, 1vw)));
    }
  }

  #fsHint {
    position: fixed;
    left: 50%;
    top: 58%;
    -webkit-transform: translateX(-50%);
    transform: translateX(-50%);
    font-size: 14px;
    color: #8a8a8e;
    color: var(--fg-dim);
    border: 1px solid #d8d8de;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    opacity: 0;
    transition: opacity .5s;
    pointer-events: none;
    white-space: nowrap;
  }
  #fsHint.show { opacity: 1; }
  #fsHint.hide { display: none; }

  /* 设置按钮 */
  #settingsBtn {
    position: fixed;
    top: 8px;
    top: calc(constant(safe-area-inset-top) + 8px);
    top: calc(env(safe-area-inset-top) + 8px);
    right: 10px;
    right: calc(constant(safe-area-inset-right) + 10px);
    right: calc(env(safe-area-inset-right) + 10px);
    width: 38px; height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: #8a8a8e;
    color: var(--fg-dim);
    border-radius: 50%;
    z-index: 20;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #settingsBtn:active { color: #111111; color: var(--fg); }
  #settingsBtn svg { width: 22px; height: 22px; }

  #orientBtn {
    position: fixed;
    top: 8px;
    top: calc(constant(safe-area-inset-top) + 8px);
    top: calc(env(safe-area-inset-top) + 8px);
    right: 54px;
    right: calc(constant(safe-area-inset-right) + 54px);
    right: calc(env(safe-area-inset-right) + 54px);
    width: 38px; height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: #8a8a8e;
    color: var(--fg-dim);
    border-radius: 50%;
    z-index: 20;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #orientBtn:active { color: #111111; color: var(--fg); }
  #orientBtn svg { width: 21px; height: 21px; }
  #orientBtn.forced { color: #0a84ff; }

  /* 设置面板 */
  #settingsMask {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  #settingsMask.open { opacity: 1; pointer-events: auto; }

  #settingsPanel {
    position: fixed;
    top: 50%; left: 50%;
    -webkit-transform: translate(-50%, -50%) scale(.96);
    transform: translate(-50%, -50%) scale(.96);
    width: 280px;
    width: 82vw;
    width: min(300px, 82vw);
    background: #ffffff;
    background: var(--panel);
    border-radius: 16px;
    padding: 18px 18px 8px;
    z-index: 31;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  #settingsPanel.open { opacity: 1; pointer-events: auto; -webkit-transform: translate(-50%, -50%) scale(1); transform: translate(-50%, -50%) scale(1); }

  #settingsPanel h2 {
    font-size: 15px;
    font-weight: 600;
    color: #111111;
    color: var(--fg);
    margin-bottom: 12px;
  }
  .theme-opt {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    padding: 12px 4px;
    font-size: 15px;
    color: #111111;
    color: var(--fg);
    border-top: 1px solid #d8d8de;
    border-top: 1px solid var(--border);
    cursor: pointer;
  }
  .theme-opt:first-of-type { border-top: none; }
  .theme-opt .radio {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid #8a8a8e;
    border: 2px solid var(--fg-dim);
    position: relative;
    flex: none;
  }
  .theme-opt.active .radio { border-color: #0a84ff; }
  .theme-opt.active .radio::after {
    content: '';
    position: absolute;
    top: 3px; right: 3px; bottom: 3px; left: 3px;
    inset: 3px;
    border-radius: 50%;
    background: #0a84ff;
  }
  #settingsClose {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 12px 0;
    border: none;
    background: transparent;
    color: #0a84ff;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="screen">
<div id="app">
  <div>
    <span id="speed" data-len="2">00</span>
    <span id="unit">km/h</span>
  </div>
</div>
<div id="status"><span id="dot" class="wait"></span><span id="statusText">GPS 定位中…</span></div>
<div id="max">最高 0.0</div>
<div id="fsHint">双击屏幕全屏</div>

<button id="orientBtn" aria-label="切换屏幕方向">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8V5a2 2 0 0 1 2-2h11"/>
    <path d="M21 16v3a2 2 0 0 1-2 2H8"/>
    <polyline points="16 3 20 3 20 7"/>
    <polyline points="8 21 4 21 4 17"/>
  </svg>
</button>
<button id="settingsBtn" aria-label="设置">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>
<div id="settingsMask"></div>
<div id="settingsPanel">
  <h2>主题</h2>
  <div class="theme-opt" data-theme-opt="auto"><span>跟随系统</span><span class="radio"></span></div>
  <div class="theme-opt" data-theme-opt="dark"><span>深色</span><span class="radio"></span></div>
  <div class="theme-opt" data-theme-opt="light"><span>浅色</span><span class="radio"></span></div>
  <button id="settingsClose">完成</button>
</div>
</div><!-- /#screen -->

<script>
(function () {
  var speedEl = document.getElementById('speed');
  var dotEl = document.getElementById('dot');
  var statusTextEl = document.getElementById('statusText');
  var maxEl = document.getElementById('max');

  var maxSpeed = 0;
  var lastFix = null;       // 上一次有效定位
  var staleTimer = null;    // 超过 5 秒没更新则置灰

  // 老浏览器可能没有 classList，用 className 兜底
  function clsAdd(el, token) {
    if (el.classList) el.classList.add(token);
    else if ((' ' + el.className + ' ').indexOf(' ' + token + ' ') < 0) el.className += ' ' + token;
  }
  function clsRemove(el, token) {
    if (el.classList) el.classList.remove(token);
    else el.className = (' ' + el.className + ' ').replace(new RegExp(' ' + token + ' ', 'g'), ' ').replace(/^\s+|\s+$/g, '').replace(/\s+/g, ' ');
  }
  window.clsAdd = clsAdd;
  window.clsRemove = clsRemove;

  function setStatus(cls, text) {
    dotEl.className = cls;
    statusTextEl.textContent = text;
  }

  function refreshStale() {
    clearTimeout(staleTimer);
    clsRemove(speedEl, 'stale');
    staleTimer = setTimeout(function () {
      clsAdd(speedEl, 'stale');
      setStatus('wait', '信号丢失');
    }, 5000);
  }

  // coords.speed 不可用时，用两次定位的距离/时间差估算
  function calcFallbackSpeed(fix) {
    if (!lastFix) return null;
    var dt = (fix.time - lastFix.time) / 1000;
    if (dt <= 0 || dt > 10) return null;
    var R = 6371000;
    var rad = Math.PI / 180;
    var dLat = (fix.lat - lastFix.lat) * rad;
    var dLon = (fix.lon - lastFix.lon) * rad;
    var sLat = Math.sin(dLat / 2);
    var sLon = Math.sin(dLon / 2);
    var a = sLat * sLat +
            Math.cos(lastFix.lat*rad) * Math.cos(fix.lat*rad) * sLon * sLon;
    var dist = 2 * R * Math.asin(Math.sqrt(a));
    return dist / dt; // m/s
  }

  function onPos(pos) {
    var c = pos.coords;
    var now = Date.now();
    var fix = { lat: c.latitude, lon: c.longitude, time: now };

    var ms = c.speed; // m/s，可能为 null
    if (ms == null || !isFinite(ms)) ms = calcFallbackSpeed(fix);

    lastFix = fix;

    if (ms == null || !isFinite(ms)) {
      setStatus('wait', '等待速度数据…');
      return;
    }

    // 低速时 GPS 抖动大，直接归零
    var kmh = ms < 0.5 ? 0 : ms * 3.6;

    var speedText = kmh >= 100 ? Math.round(kmh) : kmh.toFixed(1);
    speedEl.textContent = speedText;
    speedEl.setAttribute('data-len', speedText.length); // 不用 dataset：极老浏览器不支持
    if (window.__updateUnits) window.__updateUnits(); // 位数变化后重算像素字号
    if (kmh > maxSpeed) {
      maxSpeed = kmh;
      maxEl.textContent = '最高 ' + maxSpeed.toFixed(1);
    }

    setStatus('ok', 'GPS 已连接');
    refreshStale();
  }

  var ERR_TEXT = {
    1: '定位权限被拒绝，请在浏览器设置中允许',
    2: '位置不可用：请打开系统定位开关并到空旷处',
    3: '定位超时，正在重试…（首次定位可能需要 1 分钟）'
  };

  function onErr(err) {
    setStatus('wait', ERR_TEXT[err.code] || ('定位失败：' + err.message));
  }

  if (!navigator.geolocation) {
    setStatus('', '设备不支持定位');
    return;
  }

  if (!window.isSecureContext) {
    setStatus('', '页面非 HTTPS，浏览器已禁用定位');
  }

  navigator.geolocation.watchPosition(onPos, onErr, {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 30000
  });
})();
</script>
<script>
// 离线缓存 + PWA（manifest 由主题脚本按当前主题动态注入）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js');
  });
}

// 主题设置：跟随系统（默认）/ 深色 / 浅色，选择持久化
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('settingsBtn');
  var mask = document.getElementById('settingsMask');
  var panel = document.getElementById('settingsPanel');
  var closeBtn = document.getElementById('settingsClose');
  var opts = panel.querySelectorAll('.theme-opt');
  var themeColorMeta = document.querySelector('meta[name="theme-color"]');
  var settingsOpen = false;
  window.__settingsOpen = false; // 供全屏双击逻辑判断

  function current() {
    try { return localStorage.getItem('theme') || 'auto'; } catch (e) { return 'auto'; }
  }
  function effectiveBg() {
    return getComputedStyle(root).getPropertyValue('--bg').trim() || '#000000';
  }

  function writeManifest(bg) {
    var icon = 'data:image/svg+xml,' + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'>"
      + "<rect width='192' height='192' rx='40' fill='" + bg + "'/>"
      + "<path d='M48 124a48 48 0 0 1 96 0' fill='none' stroke='#666' stroke-width='10' stroke-linecap='round'/>"
      + "<path d='M96 124 130 78' stroke='#0c6' stroke-width='10' stroke-linecap='round'/>"
      + "</svg>");
    var manifest = {
      name: '码表', short_name: '码表', display: 'fullscreen',
      background_color: bg, theme_color: bg,
      icons: [{ src: icon, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
    };
    var link = document.querySelector('link[rel="manifest"]');
    if (!link) {
      link = document.createElement('link');
      link.rel = 'manifest';
      document.head.appendChild(link);
    }
    link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  }

  function applyTheme(t) {
    // 不用 dataset / classList.toggle：极老浏览器不支持
    if (t === 'dark' || t === 'light') root.setAttribute('data-theme', t);
    else root.removeAttribute('data-theme');
    for (var i = 0; i < opts.length; i++) {
      var on = opts[i].getAttribute('data-theme-opt') === t;
      if (on) window.clsAdd(opts[i], 'active');
      else window.clsRemove(opts[i], 'active');
    }
    // CSS 变量在下一帧才更新，延后读取
    // 老浏览器没有 requestAnimationFrame，用 setTimeout 兜底
    var raf = window.requestAnimationFrame || function (f) { setTimeout(f, 16); };
    raf(function () {
      var bg = effectiveBg();
      themeColorMeta.setAttribute('content', bg);
      writeManifest(bg);
    });
  }

  function openSettings() {
    settingsOpen = true;
    window.__settingsOpen = true;
    window.clsAdd(mask, 'open');
    window.clsAdd(panel, 'open');
  }
  function closeSettings() {
    settingsOpen = false;
    window.__settingsOpen = false;
    window.clsRemove(mask, 'open');
    window.clsRemove(panel, 'open');
  }

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    openSettings();
  });
  mask.addEventListener('click', function (e) { e.stopPropagation(); closeSettings(); });
  closeBtn.addEventListener('click', function (e) { e.stopPropagation(); closeSettings(); });
  panel.addEventListener('click', function (e) { e.stopPropagation(); });
  for (var i = 0; i < opts.length; i++) {
    (function (o) {
      o.addEventListener('click', function (e) {
        e.stopPropagation();
        var t = o.getAttribute('data-theme-opt');
        try { localStorage.setItem('theme', t); } catch (err) {}
        applyTheme(t);
      });
    })(opts[i]);
  }

  // auto 模式下系统主题变化时同步状态栏颜色
  // 旧浏览器 MediaQueryList 只有 addListener，没有 addEventListener
  if (window.matchMedia) {
    var schemeMql = window.matchMedia('(prefers-color-scheme: dark)');
    var onSchemeChange = function () {
      if (current() === 'auto') applyTheme('auto');
    };
    if (schemeMql.addEventListener) schemeMql.addEventListener('change', onSchemeChange);
    else if (schemeMql.addListener) schemeMql.addListener(onSchemeChange);
  }

  applyTheme(current());
})();

// 屏幕方向切换：点一下在 横屏 ⇄ 竖屏 之间直接切换
// 全屏时优先用原生 Screen Orientation API，失败/不支持时 CSS 旋转兜底
(function () {
  var html = document.documentElement;
  var screenEl = document.getElementById('screen');
  var speedEl = document.getElementById('speed');
  var unitEl = document.getElementById('unit');
  var statusEl = document.getElementById('status');
  var maxEl = document.getElementById('max');
  var settingsBtnEl = document.getElementById('settingsBtn');
  var btn = document.getElementById('orientBtn');
  var LABEL = { auto: '跟随系统', landscape: '横屏', portrait: '竖屏' };
  var nativeLocked = false;

  function get() { return html.getAttribute('data-orient') || 'auto'; }
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  // 按“显示方向”更新尺寸变量（旋转后物理视口与显示视口宽高互换）
  function updateUnits() {
    var mode = get();
    var pw = window.innerWidth, ph = window.innerHeight;
    var swapped = (mode === 'landscape' && pw < ph)
               || (mode === 'portrait' && pw > ph);
    var dw = swapped ? ph : pw;
    var dh = swapped ? pw : ph;
    screenEl.style.setProperty('--Uvw', (dw / 100) + 'px');
    screenEl.style.setProperty('--Uvh', (dh / 100) + 'px');

    // 老浏览器不支持 CSS 变量 / min() / dvh，字号直接用 JS 算成像素；
    // 内联样式优先级最高，任何浏览器渲染结果都一致
    var len = parseInt(speedEl.getAttribute('data-len'), 10) || 2;
    var wPct;
    if (dw > dh) wPct = 26;          // 横屏：右侧留 km/h
    else if (len === 2) wPct = 58;
    else if (len === 3) wPct = 46;
    else if (len === 4) wPct = 34;
    else wPct = 32;                  // 5 位及以上（如 123.4）
    speedEl.style.fontSize = Math.min(0.6 * dh, wPct * dw / 100) + 'px';
    unitEl.style.fontSize = (0.05 * Math.min(dw, dh)) + 'px';

    applySafeLayout(swapped);
  }
  // 供测速脚本在数字位数变化时重算字号
  window.__updateUnits = updateUnits;

  // 用隐藏探针读取四条边的安全区（挖孔/刘海高度）。
  // 部分机型全屏时 CSS env() 失效，JS 主动测量最可靠；老浏览器不支持则读到 0
  var insetProbe = null;
  function readInsets() {
    if (!insetProbe) {
      insetProbe = document.createElement('div');
      insetProbe.style.cssText = 'position:fixed;left:-9999px;top:0;visibility:hidden;pointer-events:none;';
      document.body.appendChild(insetProbe);
    }
    var sides = ['top', 'right', 'bottom', 'left'];
    var out = { top: 0, right: 0, bottom: 0, left: 0 };
    for (var i = 0; i < 4; i++) {
      var s = sides[i];
      insetProbe.style.paddingTop = 'constant(safe-area-inset-' + s + ')';
      insetProbe.style.paddingTop = 'env(safe-area-inset-' + s + ')';
      var v = window.getComputedStyle ? parseFloat(getComputedStyle(insetProbe).paddingTop) : 0;
      out[s] = isFinite(v) ? v : 0;
    }
    insetProbe.style.paddingTop = '0px';
    return out;
  }

  // 全屏时若测不到安全区（机型 env() 失效），给显示顶边一个挖孔高度兜底，防止遮挡文字
  var FULLSCREEN_TOP_MIN = 28;

  // 把物理安全区按"显示方向"映射到屏幕边，内联应用到顶部一排和底部最高速度
  function applySafeLayout(swapped) {
    var ins = readInsets();
    var mode = get();
    var topI = ins.top, rightI = ins.right, bottomI = ins.bottom;
    if (swapped && mode === 'landscape') {
      // 物理竖屏强制横屏：显示上=物理右，显示右=物理下，显示下=物理左
      topI = ins.right; rightI = ins.bottom; bottomI = ins.left;
    } else if (swapped && mode === 'portrait') {
      // 物理横屏强制竖屏：显示上=物理左，显示右=物理上，显示下=物理右
      topI = ins.left; rightI = ins.top; bottomI = ins.right;
    }
    if (isFullscreen() && topI < FULLSCREEN_TOP_MIN) topI = FULLSCREEN_TOP_MIN;
    statusEl.style.top = (topI + 10) + 'px';
    statusEl.style.bottom = 'auto';
    maxEl.style.bottom = (bottomI + 12) + 'px';
    settingsBtnEl.style.top = (topI + 8) + 'px';
    settingsBtnEl.style.right = (rightI + 10) + 'px';
    btn.style.top = (topI + 8) + 'px';
    btn.style.right = (rightI + 54) + 'px';
  }

  // 老浏览器没有 Promise，用一个假的 thenable 保持调用方一致
  function fakeThenable(val) {
    return { then: function (f) { if (f) f(val); return fakeThenable(val); }, catch: function () { return fakeThenable(val); } };
  }

  function tryNativeLock(mode) {
    if (!screen.orientation || !screen.orientation.lock || !isFullscreen()) return fakeThenable(false);
    if (mode === 'auto') {
      if (nativeLocked) { try { screen.orientation.unlock(); } catch (e) {} }
      nativeLocked = false;
      return fakeThenable(false);
    }
    var p = screen.orientation.lock(mode);
    if (!p || !p.then) return fakeThenable(false);
    return p.then(function () {
      nativeLocked = true;
      return true;
    }).catch(function () { return false; });
  }

  function render() {
    var mode = get();
    if (mode !== 'auto') window.clsAdd(btn, 'forced');
    else window.clsRemove(btn, 'forced');
    btn.title = '屏幕方向：' + LABEL[mode] + '（点击切换）';
    updateUnits();
  }

  function setMode(mode) {
    try {
      if (mode === 'auto') localStorage.removeItem('orient');
      else localStorage.setItem('orient', mode);
    } catch (e) {}
    if (mode === 'auto') html.removeAttribute('data-orient');
    else html.setAttribute('data-orient', mode);
    // 原生锁定成功后物理方向会跟着转，CSS 旋转规则自动不匹配（不会双重旋转）
    tryNativeLock(mode).then(render);
    render();
  }

  // 点一下直接切换显示方向：当前显示竖屏 → 横屏，当前显示横屏 → 竖屏
  // auto 状态下按当前物理方向判断"当前显示方向"，切到相反方向
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    var mode = get();
    var next;
    if (mode === 'landscape') next = 'portrait';
    else if (mode === 'portrait') next = 'landscape';
    else next = (window.innerWidth > window.innerHeight) ? 'portrait' : 'landscape';
    setMode(next);
  });

  // 进入/退出全屏时重新评估原生锁定；退出后 CSS 兜底自动接管
  function onFsChange() {
    if (isFullscreen()) tryNativeLock(get());
    else if (nativeLocked) {
      try { screen.orientation.unlock(); } catch (e) {}
      nativeLocked = false;
    }
    render();
    // 全屏过渡动画结束后安全区才稳定，延迟再刷一次
    setTimeout(render, 350);
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  window.addEventListener('resize', updateUnits);
  window.addEventListener('orientationchange', updateUnits);
  window.addEventListener('load', render);
  render();
})();

// 双击切换全屏 + 屏幕常亮（Wake Lock）
(function () {
  var hint = document.getElementById('fsHint');

  function isStandalone() {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone === true; // iOS Safari
  }
  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function enterFullscreen() {
    if (isFullscreen()) return;
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) {
      var p = fn.call(el);
      if (p && typeof p.catch === 'function') p.catch(function () {});
    }
  }
  function exitFullscreen() {
    var fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (fn) {
      var p = fn.call(document);
      if (p && typeof p.catch === 'function') p.catch(function () {});
    }
  }
  function toggleFullscreen() {
    if (isFullscreen()) exitFullscreen();
    else enterFullscreen();
    window.clsAdd(hint, 'hide');
  }

  // 双击检测：触摸和鼠标统一走 click，300ms 内两次视为双击
  var lastTap = 0;
  function onTap(e) {
    if (window.__settingsOpen) return; // 设置面板打开时不响应
    var now = Date.now();
    if (now - lastTap < 300) {
      e.preventDefault();
      toggleFullscreen();
      lastTap = 0;
    } else {
      lastTap = now;
    }
  }
  document.addEventListener('click', onTap);
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });

  // standalone（从主屏幕图标启动）本就全屏，隐藏提示
  if (isStandalone()) window.clsAdd(hint, 'hide');
  else setTimeout(function () { window.clsAdd(hint, 'show'); }, 800);

  // 屏幕常亮：Wake Lock API（需 HTTPS），页面重新可见时自动重新申请
  var wakeLock = null;
  function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    var p = navigator.wakeLock.request('screen');
    if (p && typeof p.then === 'function') {
      p.then(function (lock) {
        wakeLock = lock;
        if (lock && typeof lock.addEventListener === 'function') {
          lock.addEventListener('release', function () { wakeLock = null; });
        }
      }).catch(function () {});
    }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
  });
  // 首次交互后申请（部分浏览器要求用户手势）
  // 不用 { once: true }：旧浏览器会把 options 对象误当作 capture=true，导致移除失败
  var onceRequestWakeLock = function () {
    requestWakeLock();
    document.removeEventListener('click', onceRequestWakeLock);
  };
  document.addEventListener('click', onceRequestWakeLock);
  requestWakeLock();
})();
</script>
</body>
